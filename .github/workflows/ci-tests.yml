name: CI Tests

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/ci-tests.yml"

jobs:
  backend-tests:
    name: Backend (.NET) tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        working-directory: backend
        run: dotnet restore NovadisApi.slnx

      - name: Build
        working-directory: backend
        run: dotnet build NovadisApi.slnx --no-restore --configuration Release

      - name: Test
        working-directory: backend
        run: dotnet test NovadisApi.slnx --configuration Release --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/TestResults/

  frontend-tests:
    name: Frontend (Flutter) tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Version épinglée sur celle du poste de développement : sans elle, la CI
          # installe le dernier Flutter publié et valide donc autre chose que ce qui
          # est réellement exécuté — et peut casser à chaque publication en amont
          # (c'est ce qui s'est produit avec la contrainte intl le 2026-09-07).
          # À faire évoluer avec la montée de version Flutter (étape 4.3 du plan),
          # en modifiant le poste et la CI dans le même geste.
          flutter-version: 3.41.4

      - name: Pub get
        working-directory: frontend
        run: flutter pub get

      - name: Analyze
        working-directory: frontend
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: frontend
        run: flutter test
