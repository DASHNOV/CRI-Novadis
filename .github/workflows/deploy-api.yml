name: Deploy API to Production

on:
  workflow_dispatch:
  push:
    # `main` est la branche de PRODUCTION : c'est elle qui déploie.
    # `dev` est la branche de développement — elle ne déclenche que ci-tests.yml.
    branches:
      - main
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - "scripts/deploy-remote.sh"
      - ".github/workflows/deploy-api.yml"

# Deux déploiements simultanés se disputeraient l'image :latest et le retour arrière.
concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  IMAGE_NAME: cri-novadis-api
  REMOTE_DIR: /opt/cri-novadis

jobs:
  tests:
    uses: ./.github/workflows/ci-tests.yml

  deploy:
    # Pas de mise en production si un test échoue.
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Image taguée par SHA de commit : c'est ce qui rend le retour arrière
      # possible. deploy-remote.sh la retague :latest sur le serveur.
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/src/NovadisApi
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          outputs: type=docker,dest=/tmp/${{ env.IMAGE_NAME }}.tar

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Transfer image, compose file and deploy script
        run: |
          scp /tmp/${{ env.IMAGE_NAME }}.tar \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/${{ env.IMAGE_NAME }}.tar
          scp docker-compose.yml scripts/deploy-remote.sh \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.REMOTE_DIR }}/

      # Dump de la base, redémarrage, attente de /api/health/ready, et retour
      # arrière automatique sur l'image précédente en cas d'échec.
      # Le job échoue dans ce dernier cas : un retour arrière reste un incident.
      - name: Deploy with automatic rollback
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "bash ${{ env.REMOTE_DIR }}/deploy-remote.sh /tmp/${{ env.IMAGE_NAME }}.tar ${{ github.sha }}"

      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/id_ed25519
