services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-cri_novadis}
      POSTGRES_USER: ${DB_USER:-cri_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cri_user} -d ${DB_NAME:-cri_novadis}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Plafonds mémoire — voir le commentaire du service `api` ci-dessous.
    mem_limit: 768m
    shm_size: 256m

  api:
    image: cri-novadis-api:latest
    ports:
      - "127.0.0.1:5200:5200"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${DB_NAME:-cri_novadis};Username=${DB_USER:-cri_user};Password=${DB_PASSWORD}
      - Jwt__SecretKey=${JWT_SECRET}
      - Email__TenantId=${EMAIL_TENANT_ID}
      - Email__ClientId=${EMAIL_CLIENT_ID}
      - Email__ClientSecret=${EMAIL_CLIENT_SECRET}
      - Email__FromAddress=${EMAIL_FROM}
      - Email__FromName=${EMAIL_FROM_NAME:-Novadis CRI}
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      db:
        condition: service_healthy
    restart: always
    # Plafonds de ressources — sans eux, un export XLSX annuel consomme la mémoire
    # de l'HÔTE et fige le VPS au lieu de faire échouer la seule requête fautive.
    # Ajuster à la RAM réelle du serveur : viser api + db ≈ 70 % du total.
    # memswap_limit = mem_limit désactive le swap (sinon le conteneur rame sans
    # jamais déclencher l'OOM killer, ce qui reproduit le symptôme de gel).
    # Pas de limite `cpus` : le serveur n'a qu'un seul cœur, et Docker rejette
    # toute valeur supérieure à 1.00 ("range of CPUs is from 0.01 to 1.00").
    # Plafonner le CPU n'apporterait rien ici — c'est la mémoire qui a figé
    # l'hôte, pas la contention processeur.
    mem_limit: 1g
    memswap_limit: 1g
    # Permet à Docker de redémarrer une API bloquée mais encore vivante.
    # curl est installé dans l'étape runtime du Dockerfile pour cette sonde.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5200/api/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # Le conteneur tourne en USER app (UID/GID 1654, images .NET 8+).
    # Les dossiers hôte montés ci-dessous DOIVENT lui appartenir, sinon toute
    # écriture échoue en "Access to the path ... is denied" :
    #   sudo mkdir -p logs uploads export-storage
    #   sudo chown -R 1654:1654 logs uploads export-storage
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./export-storage:/app/export-storage

volumes:
  postgres_data:
