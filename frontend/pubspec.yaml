  markdown: ^7.2.1
  image: ^4.5.4
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  gap: ^3.0.1
  connectivity_plus: ^6.0.0
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  flutter_map_marker_cluster: ^8.2.2
  google_maps_flutter: ^2.18.1
  url_launcher: ^6.3.2
  pointer_interceptor: ^0.10.1+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.20.0

flutter:
